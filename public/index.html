<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a14">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Venganza 2.0">
  <meta name="robots" content="noindex, nofollow">
  <title>LA VENGANZA 2.0 · Nixi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/games.css">
  <link rel="stylesheet" href="/css/fx.css">
</head>
<body>
  <div id="app" data-theme="c1">
    <div id="bg" aria-hidden="true">
      <div class="bg-layer" data-for="c1"></div><div class="bg-layer" data-for="c2"></div>
      <div class="bg-layer" data-for="c3"></div><div class="bg-layer" data-for="c4"></div>
      <div class="bg-glow"></div><div class="bg-grain"></div><div class="bg-vignette"></div>
    </div>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <header id="hud" hidden></header>
    <main id="stage" tabindex="-1" aria-live="polite"></main>
    <div id="bouncers" aria-hidden="true"></div>
    <canvas id="fxcanvas" aria-hidden="true"></canvas>
    <div id="overlay-root"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="testbar" hidden></div>
  </div>
  <noscript><p style="padding:2rem;font-family:sans-serif;color:#fff">Esta aventura necesita JavaScript. Actívalo y vuelve a abrir la página.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
