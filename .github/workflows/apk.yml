name: Compilar app Android (APK)
on:
  workflow_dispatch: {}
  push:
    paths: ['app/**', '.github/workflows/apk.yml', 'icons/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Proyecto Android (Capacitor)
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Icono, permisos y orientación
        working-directory: app/android/app/src/main
        run: |
          R=res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; convert "$GITHUB_WORKSPACE/icons/icon-512.png" -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png; cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png; done
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do n=${d%%:*}; s=${d##*:}; convert "$GITHUB_WORKSPACE/icons/icon-maskable-512.png" -resize ${s}x${s} $R/mipmap-$n/ic_launcher_foreground.png; done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#0B0A14</color></resources>\n' > $R/values/ic_launcher_background.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' AndroidManifest.xml
      - name: Compilar
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk venganza.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk venganza.apk --title "App Android" --notes "APK de La Venganza 2.0 para Android." --latest=false
